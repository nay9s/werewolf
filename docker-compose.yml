services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build: ./server
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  # เปิดใช้ด้วย: docker compose --profile https up -d  (ตั้ง DOMAIN ใน .env)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - client
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
