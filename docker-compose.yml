services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build: ./server
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis-data:
